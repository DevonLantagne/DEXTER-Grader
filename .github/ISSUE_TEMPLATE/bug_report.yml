name: Bug report
description: Report a bug in DEXTER Grader
title: "[BUG] <title>"
labels: ["bug"]
assignees:
  - DevonLantagne
body:
  - type: markdown
    attributes:
      value: |
        ### Bug Report
        Use this form to report bugs or unexpected behavior in the app.
        Please provide enough detail to reproduce the problem. If possible, include example input/output.

  - type: checkboxes
    id: features
    attributes:
      label: Features affected
      options:
        - label: UI display
        - label: Grade calculation
        - label: Starting a new project
        - label: Opening an existing project
        - label: Reports and Exports

  - type: input
    id: app_version
    attributes:
      label: App version
      description: "What version of the app are you using? If on the dev branch, what commit hash?"
      placeholder: e.g., 1.1.3

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - 🔴 Critical (system crash or data corruption)
        - 🟠 Major (unusable, breaking workflow, disruptive)
        - 🟢 Minor (typo, wrong output, logging issue)

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: "Describe the problem. What did you expect to happen?"

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Describe how to reproduce the issue. Consider uploading files, screenshots, or logs."
